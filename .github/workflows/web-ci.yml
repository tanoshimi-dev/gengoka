name: Web CI

on:
  push:
    branches: [main]
    paths: ['sys/frontend/user/web/**']
  pull_request:
    branches: [main]
    paths: ['sys/frontend/user/web/**']

defaults:
  run:
    working-directory: sys/frontend/user/web

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: sys/frontend/user/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
