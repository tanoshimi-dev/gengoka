[package]
name = "gengoka-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
actix-web = "4.9"
actix-cors = "0.7"
actix-rt = "2"

# Async runtime
tokio = { version = "1.42", features = ["full"] }

# Database
sqlx = { version = "0.7.4", features = ["runtime-tokio", "postgres", "uuid", "chrono"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# UUID
uuid = { version = "1.11", features = ["v4", "serde"] }

# Date/Time
chrono = { version = "0.4.38", features = ["serde"] }

# Environment
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Validation
validator = { version = "0.16", features = ["derive"] }

# Error handling
thiserror = "1.0.68"
anyhow = "1"

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Cron scheduler
tokio-cron-scheduler = "0.13"

# Retry with backoff
backoff = { version = "0.4", features = ["tokio"] }

# Tracing for actix-web
tracing-actix-web = "0.7"

# JWT Authentication
jsonwebtoken = "9"
sha2 = "0.10"

# Admin panel
argon2 = "0.5"
actix-session = { version = "0.10", features = ["cookie-session"] }
askama = "0.12"
askama_actix = "0.14"
actix-files = "0.6"
futures = "0.3"
hex = "0.4"
totp-rs = { version = "5", features = ["otpauth", "qr", "gen_secret"] }
rand = "0.8"

[dev-dependencies]
wiremock = "0.6"
rsa = "0.9"
base64 = "0.22"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
